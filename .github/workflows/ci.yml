name: CI

on:
  push:
    branches: [master, harness-dev]
  pull_request:
    branches: [master, harness-dev]

jobs:
  portable-core-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run portable core checks
        run: ./gradlew :core:check --no-daemon

  windows-integration-check:
    # HRNS-NOW is a Windows desktop application. The infra suite deliberately
    # launches powershell.exe/cmd.exe and asserts Windows path encoding, so the
    # full integration gate must run on Windows rather than being skipped on Linux.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run full checks
        shell: powershell
        run: .\gradlew.bat check --no-daemon
